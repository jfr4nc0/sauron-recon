[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sauron-recon"
version = "0.1.0"
description = "Deterministic commercial-property reconnaissance core for Hermes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "jfr4nc0"}]
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
crawler = ["crawl4ai>=0.9.2"]

[project.scripts]
sauron-recon = "sauron_recon.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
