name: sauron-recon
version: 0.1.0
description: "Hermes profile distribution for resilient commercial-property reconnaissance and Telegram reports."
hermes_requires: ">=0.12.0"
author: "jfr4nc0"
license: "MIT"
env_requires:
  - name: FIRECRAWL_API_URL
    description: "Firecrawl base URL, for example http://localhost:3002"
    required: false
    default: ""
  - name: FIRECRAWL_API_KEY
    description: "Firecrawl API key when the configured endpoint requires authentication"
    required: false
    default: ""
  - name: TELEGRAM_BOT_TOKEN
    description: "Telegram bot token used by the gateway/runtime delivery layer"
    required: false
    default: ""
  - name: TELEGRAM_ALLOWED_USERS
    description: "Comma-separated numeric Telegram user IDs allowed to use the bot"
    required: false
    default: ""
  - name: TELEGRAM_ALLOWED_CHATS
    description: "Optional comma-separated Telegram chat IDs allowed for group/channel operation"
    required: false
    default: ""
  - name: TELEGRAM_GROUP_ALLOWED_CHATS
    description: "Optional Telegram group chat IDs whose unmentioned messages may be observed"
    required: false
    default: ""
  - name: TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES
    description: "Whether allowlisted unmentioned Telegram group messages are recorded as context"
    required: false
    default: "false"
  - name: SAURON_RECON_DATA_DIR
    description: "Directory for local SQLite state and generated reports"
    required: false
    default: "./runtime"
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - config.yaml
  - mcp.json
  - skills/sauron-recon/
  - cron/
  - knowledge/
  - src/
  - tests/
  - plugins/sauron_recon_telegram/
  - pyproject.toml
  - README.md
  - PLAN.md
  - .env.example
  - .env.template
